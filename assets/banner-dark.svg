<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="ashab khatsiev — vibe coder, berlin">
  <defs>
    <radialGradient id="glut" cx="16%" cy="120%" r="88%">
      <stop offset="0%"   stop-color="#E8621F" stop-opacity=".44"/>
      <stop offset="42%"  stop-color="#E8621F" stop-opacity=".11"/>
      <stop offset="100%" stop-color="#E8621F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kern" cx="12%" cy="124%" r="32%">
      <stop offset="0%"   stop-color="#FFB765" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#FFB765" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="linie" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#E8621F"/>
      <stop offset="60%"  stop-color="#E8621F" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#E8621F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#12100E"/>
  <rect width="1200" height="300" fill="url(#glut)"/>
  <rect width="1200" height="300" fill="url(#kern)"/>

  <g>
    <circle cx="196" cy="262" r="2.1" fill="#FFB765" opacity="0">
      <animate attributeName="cy" values="262;70" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.85;0" dur="7.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="96" cy="284" r="1.6" fill="#E8621F" opacity="0">
      <animate attributeName="cy" values="284;112" dur="9.5s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.75;0" dur="9.5s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="292" cy="292" r="1.8" fill="#FFB765" opacity="0">
      <animate attributeName="cy" values="292;132" dur="8.5s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.65;0" dur="8.5s" begin="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="388" cy="276" r="1.4" fill="#E8621F" opacity="0">
      <animate attributeName="cy" values="276;96" dur="11s" begin="5.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.6;0" dur="11s" begin="5.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="82" y="100" fill="#8A7B6C"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" letter-spacing="3.6">BERLIN</text>

  <text x="80" y="186" fill="#F0E7DA"
        font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
        font-size="78" letter-spacing="-1.2">ashab khatsiev</text>

  <rect x="82" y="216" width="440" height="1.5" fill="url(#linie)"/>

  <text x="82" y="258" fill="#E8621F"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="20" letter-spacing=".4">vibe coder</text>

</svg>
